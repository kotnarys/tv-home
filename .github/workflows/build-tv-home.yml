name: Build tv-home APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-tv-home.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK components
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build APK (build only)
        run: bash launcher/build-and-install.sh --build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: launcher/build/tvhome.apk
          if-no-files-found: error
