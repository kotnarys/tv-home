name: Build tv-home APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-tv-home.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android Command-line Tools and SDK
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/cmdline-tools.zip" \
            'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip'
          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" -d "$RUNNER_TEMP/commandline-extract"
          mv "$RUNNER_TEMP/commandline-extract/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-34' 'build-tools;34.0.0'
      - name: Build APK only (no TV changes)
        run: bash launcher/build-and-install.sh --build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: launcher/build/tvhome.apk
          if-no-files-found: error
