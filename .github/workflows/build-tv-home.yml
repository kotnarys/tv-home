name: Build tv-home APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'launcher/**'
      - '.github/workflows/build-tv-home.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK components
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Build APK (do not install or disable stock launcher)
        run: bash launcher/build-and-install.sh --build
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tv-home-apk
          path: launcher/build/tvhome.apk
          if-no-files-found: error

